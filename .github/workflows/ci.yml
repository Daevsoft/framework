name: CI

on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]

permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: swoole-6.2.3, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit locked Composer dependencies
        run: composer audit --no-interaction

      - name: Check PHP syntax
        run: find app core tests benchmarks -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit and routing tests
        shell: bash
        run: |
          set +e
          ./vendor/bin/phpunit --debug > phpunit.log 2>&1
          result=$?
          cat phpunit.log
          exit $result

      - name: Verify CLI commands
        run: |
          php ds > cli-help.txt
          grep -q 'serve' cli-help.txt
          grep -q 'fpm:serve' cli-help.txt
          grep -q 'migrate' cli-help.txt
          grep -q 'config' cli-help.txt
          grep -q 'add:controller' cli-help.txt
          grep -q 'add:model' cli-help.txt
          grep -q 'add:view' cli-help.txt
          grep -q 'add:test' cli-help.txt
          grep -q 'add:migration' cli-help.txt
          grep -q 'add:helper' cli-help.txt
          grep -q 'add:job' cli-help.txt
          grep -q 'cronjob' cli-help.txt
          grep -q 'cache' cli-help.txt
          grep -q 'route:list' cli-help.txt
          grep -q 'test' cli-help.txt
          php ds route:list > route-list.txt
          grep -q '/health' route-list.txt
          grep -q '/ws' route-list.txt


      - name: Swoole HTTP and multi-worker WebSocket smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP_RUNTIME=swoole APP_ENV=testing SERVER_HOST=127.0.0.1 SERVER_PORT=8123 \
            SWOOLE_WORKERS=2 SWOOLE_DISPATCH_MODE=2 SWOOLE_TASK_WORKERS=0 SWOOLE_MAX_REQUEST=1000 \
            php app/bootstrap/app.php > swoole.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8123/health > health.json; then
              break
            fi
            sleep 1
          done

          php -r '$data = json_decode(file_get_contents("health.json"), true); if (($data["status"] ?? null) !== "ok") { fwrite(STDERR, "Invalid health response\n"); exit(1); }'
          curl --silent --fail http://127.0.0.1:8123/users/42 > user.json
          php -r '$data = json_decode(file_get_contents("user.json"), true); if (($data["id"] ?? null) !== 42) { fwrite(STDERR, "Parameterized route failed\n"); exit(1); }'
          bash tests/scripts/routing-http-smoke.sh http://127.0.0.1:8123

          php -r '
          Swoole\Coroutine\run(function (): void {
              $client = new Swoole\Coroutine\Http\Client("127.0.0.1", 8123);
              $client->set(["timeout" => 3]);
              if (!$client->upgrade("/ws")) {
                  throw new RuntimeException("WebSocket upgrade failed: " . $client->errMsg);
              }
              $connected = $client->recv();
              if (!$connected || !str_contains((string) $connected->data, "connected")) {
                  throw new RuntimeException("WebSocket connect frame was not received.");
              }
              if (!$client->push("ci-websocket-smoke")) {
                  throw new RuntimeException("WebSocket client could not send a frame.");
              }
              $echo = $client->recv();
              if (!$echo || !str_contains((string) $echo->data, "ci-websocket-smoke")) {
                  throw new RuntimeException("WebSocket echo frame was not received.");
              }
              $client->close();
          });
          '

          php -r '
          Swoole\Coroutine\run(function (): void {
              $clients = [];
              $byWorker = [];
              for ($attempt = 0; $attempt < 8 && count($byWorker) < 2; $attempt++) {
                  $client = new Swoole\Coroutine\Http\Client("127.0.0.1", 8123);
                  $client->set(["timeout" => 4]);
                  if (!$client->upgrade("/__test/broadcast")) {
                      throw new RuntimeException("Cross-worker WebSocket upgrade failed: " . $client->errMsg);
                  }
                  $connected = $client->recv();
                  $info = $connected ? json_decode((string) $connected->data, true) : null;
                  if (!is_array($info) || !isset($info["worker_id"])) {
                      throw new RuntimeException("Test WebSocket connection did not report its worker ID.");
                  }
                  $clients[] = $client;
                  $workerId = (int) $info["worker_id"];
                  $byWorker[$workerId] ??= $client;
              }

              if (count($byWorker) < 2) {
                  throw new RuntimeException("Could not place WebSocket clients on two distinct workers.");
              }

              $workers = array_values($byWorker);
              if (!$workers[0]->push("ci-cross-worker-smoke")) {
                  throw new RuntimeException("Cross-worker WebSocket sender could not send.");
              }

              $echo = $workers[0]->recv();
              $broadcast = $workers[1]->recv();
              $frame = $broadcast ? json_decode((string) $broadcast->data, true) : null;
              if (!$echo || !str_contains((string) $echo->data, "ci-cross-worker-smoke")
                  || !is_array($frame)
                  || ($frame["event"] ?? null) !== "CiBroadcast"
                  || ($frame["data"]["message"] ?? null) !== "ci-cross-worker-smoke") {
                  throw new RuntimeException("Cross-worker PipeMessage broadcast was not received.");
              }

              foreach ($clients as $client) {
                  $client->close();
              }
          });
          '

      - name: Swoole HTTP fallback-context smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP_RUNTIME=swoole SERVER_HOST=127.0.0.1 SERVER_PORT=8125 \
            SWOOLE_WORKERS=1 SWOOLE_TASK_WORKERS=0 SWOOLE_MAX_REQUEST=1000 \
            SWOOLE_COROUTINE=0 php app/bootstrap/app.php > swoole-fallback.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8125/health > fallback-health.json; then
              break
            fi
            sleep 1
          done

          for attempt in {1..5}; do
            curl --silent --fail http://127.0.0.1:8125/health > fallback-health.json
          done
          php -r '$data = json_decode(file_get_contents("fallback-health.json"), true); if (($data["status"] ?? null) !== "ok") { fwrite(STDERR, "Invalid fallback-context response\\n"); exit(1); }'

      - name: FPM compatibility smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP_RUNTIME=fpm php -S 127.0.0.1:8124 -t public/ > fpm.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8124/health > fpm-health.json; then
              break
            fi
            sleep 1
          done

          php -r '$data = json_decode(file_get_contents("fpm-health.json"), true); if (($data["status"] ?? null) !== "ok") { fwrite(STDERR, "Invalid FPM health response\\n"); exit(1); }'
          bash tests/scripts/routing-http-smoke.sh http://127.0.0.1:8124

      - name: Configuration cache smoke test
        run: |
          php ds config
          test -f app/storage/cache/config.php
          php ds config --clear

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-test-diagnostics
          path: |
            phpunit.log
            swoole.log
            health.json
            user.json
            fpm.log
            fpm-health.json
            swoole-fallback.log
            fallback-health.json
            cli-help.txt
            route-list.txt
          if-no-files-found: ignore
