name: CI

on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: find app core tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit and routing tests
        shell: bash
        run: |
          set +e
          ./vendor/bin/phpunit --debug > phpunit.log 2>&1
          result=$?
          cat phpunit.log
          exit $result

      - name: Upload PHPUnit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-diagnostics
          path: phpunit.log
          if-no-files-found: ignore
