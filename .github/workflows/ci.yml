name: CI

on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: swoole
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: find app core tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit and routing tests
        shell: bash
        run: |
          set +e
          ./vendor/bin/phpunit --debug > phpunit.log 2>&1
          result=$?
          cat phpunit.log
          exit $result

      - name: Swoole HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP_RUNTIME=swoole SERVER_HOST=127.0.0.1 SERVER_PORT=8123 \
            SWOOLE_WORKERS=1 SWOOLE_TASK_WORKERS=0 SWOOLE_MAX_REQUEST=1000 \
            php app/bootstrap/app.php > swoole.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8123/health > health.json; then
              break
            fi
            sleep 1
          done

          php -r '$data = json_decode(file_get_contents("health.json"), true); if (($data["status"] ?? null) !== "ok") { fwrite(STDERR, "Invalid health response\n"); exit(1); }'
          curl --silent --fail http://127.0.0.1:8123/users/42 > user.json
          php -r '$data = json_decode(file_get_contents("user.json"), true); if (($data["id"] ?? null) !== 42) { fwrite(STDERR, "Parameterized route failed\n"); exit(1); }'

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-test-diagnostics
          path: |
            phpunit.log
            swoole.log
            health.json
            user.json
          if-no-files-found: ignore
