name: Routing Benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Samples per benchmark scenario (10-5000)
        required: false
        default: '1000'
        type: string
      sizes:
        description: Comma-separated route counts (for example 100,1000,10000)
        required: false
        default: '100,1000,10000'
        type: string
  schedule:
    - cron: '41 3 * * 2'
  push:
    branches: [v4]
    paths:
      - 'core/Routing/**'
      - 'core/Http/RequestDispatcher.php'
      - 'benchmarks/routing.php'
      - '.github/workflows/routing-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: routing-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCH_ITERATIONS: ${{ github.event.inputs.iterations || '1000' }}
      BENCH_SIZES: ${{ github.event.inputs.sizes || '100,1000,10000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate benchmark inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BENCH_ITERATIONS" =~ ^[1-9][0-9]*$ ]]
          (( BENCH_ITERATIONS >= 10 && BENCH_ITERATIONS <= 5000 ))
          [[ "$BENCH_SIZES" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]
          IFS=',' read -ra sizes <<< "$BENCH_SIZES"
          for size in "${sizes[@]}"; do
            (( size >= 2 && size <= 10000 ))
          done

      - name: Capture runner environment
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS"
            echo "PHP:"
            php -v
            echo "Composer:"
            composer --version
            echo "Iterations: $BENCH_ITERATIONS"
            echo "Route sizes: $BENCH_SIZES"
          } | tee routing-benchmark-environment.txt

      - name: Run routing benchmark
        run: php benchmarks/routing.php --iterations="$BENCH_ITERATIONS" --sizes="$BENCH_SIZES" | tee routing-benchmark.txt

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-benchmark-${{ github.run_id }}
          path: |
            routing-benchmark.txt
            routing-benchmark-environment.txt
          if-no-files-found: warn
          retention-days: 30
